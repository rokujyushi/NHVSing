# config_nnsvs_48k_polish.yaml — the low-LR finish after config_nnsvs_48k.yaml, as in V3.2: resume the
# ep350 snapshot (same snapshot_dir, auto-resume from the latest) and train 50 more epochs at 1/5 the
# learning rate (lr_g 8e-5, lr_d 4e-5, D:G ratio kept). Everything else is config_nnsvs_48k.yaml's.
#   python train_v3.py --config config_nnsvs_48k_polish.yaml
# config_nnsvs_48k.yaml — NHVSing V3 for nnsvs melf0 voicebanks (ENUNU). Recipe = config_v3_2.yaml
# with the input features switched to what nnsvs's melf0 acoustic models output:
#   - 48 kHz / hop 240 (5 ms) / 80-mel, fft 1024 / win 960, fmin 30 / fmax 24000, log10 floor 1e-10
#     = parallel_wavegan.bin.preprocess.logmelfilterbank as called from nnsvs MelF0 (librosa.stft
#     center=True, reflect). preprocess.mel_format: nnsvs switches preprocess_nnsvs.py, the pitch
#     augmentation, the amplitude augmentation and the mel loss to this formula.
#   - waveform NOT RMS-normalised (nnsvs computes the mel on the raw +-1 waveform).
#   - F0 = nnsvs MelF0 without the score: harvest (fixed range), vuv from D4C aperiodicity,
#     slinear-interpolated log-F0 smoothed at 20 Hz. Stored as 0=unvoiced like preprocess.py.
# Training-side changes from config_v3_2.yaml:
#   - mel_loss_scale 30 -> 69: log10 values are 1/ln(10) of ln, so x2.3 keeps the same weight.
#   - mel_loss_floor -5: clamp both sides of the mel loss at log10 1e-5 (the diffsinger mel's floor);
#     without it the loss chases the -7.45 dither floor above 22.05 kHz of 44.1 kHz material.
#   - crop_frames 64 = 15360 samples = 320 ms at 48 kHz (was 372 ms).
# Everything else (Hann WOLA, phase jitter, losses, D, schedule) is config_v3_2.yaml's.

seed: 42
device: "cuda"

preprocess:
  mel_format:  'nnsvs'           # log10 mel of nnsvs melf0 (see header)
  sample_rate: 48000
  hop_size:    240
  fft_size:    1024
  win_size:    960
  mel_dim:     80
  mel_min:     30.0
  mel_max:     24000.0
  mel_eps:     1.0e-10
  mel_vmin:    -8.0              # TensorBoard mel plot range (log10)
  mel_vmax:    1.0
  res_type:    'soxr_hq'         # nnsvs uses kaiser_best (needs resampy); only the resampler's edge differs
  # F0 (nnsvs MelF0 without the score): harvest + D4C vuv + 20 Hz smoothing
  f0_extractor: 'harvest'
  f0_min:      71.0              # nnsvs melf0_48k.yaml f0_floor
  f0_max:      1000.0            # nnsvs takes the ceiling from the score (max note + 2 semitones); fixed here
  d4c_threshold: 0.5
  f0_smoothing_cutoff: 20        # Hz (nnsvs trajectory_smoothing_cutoff_f0)
  cut_wavs:
    silence_thresh:  -50.0
    min_silence_dur: 0.10
    max_dur:         30.0
    long_silence:    0.5
    pad:             0.10
  data_filtering:
    min_frames: 150
    max_frames: 99999

common_params: &common_params
  hop_size:      240
  in_channels:   80             # = mel_dim. Input width of the mel conv
  conv_channels: 256
  kernel_size:   3
  dilation_size: 1
  group_size:    8
  use_causal:    false

model:
  vocoder:
    <<: *common_params
    sample_rate:     48000
    noise_std:       0.03
    use_weight_norm: true
    f0_upsample:     linear     # smooth instantaneous frequency (sharper harmonics)
    n_harmonic:      200        # white 200-harmonic (flat amplitude, Nyquist soft mask)
    excit_phase_jitter: true    # ★train-only: randomise impulse start phase per batch (eval/ONNX = phase 0)

  ltv_filter:
    <<: *common_params
    ccep_size:       256
    ccep_size_noise: 256        # noise uses the same complex-cepstrum head as harmonic
    fft_size:        1024       # LTV cepstrum -> IR FFT (independent of the mel FFT; fft >= ccep)
    n_ltv_layers:    2          # per Liu2020 NHV (ConvLayers = input proj + 2 hidden + output proj)
    use_quef_norm:   true
    quef_norm_alpha: 1.0
    use_shared_trunk: true      # shared trunk (V2/V3)
    use_hard_vuv:    true       # uv hard gate
    use_v3:          true       # ← selects NHVSingV3 (final model). hop512 variant: use_v3x: true
    ola_mode:        hann       # ★Hann WOLA (fixes the high-pitch 1-period dropout). ONNX export matches.

discriminator:
  use_hifigan_disc: true
  discriminator_periods: [3, 5, 7, 11, 17, 23, 37]
  use_msd: false                # no MSD
  use_mpd: true                 # MPD (period/phase)
  use_mrd: true                 # MRD (UnivNet multi-resolution spectrogram magnitude)

training:
  # ── data / output (set to your own paths) ──
  train_dir: 'dataset/nnsvs48k/train'  # preprocess_nnsvs.py output
  test_dir:  'dataset/nnsvs48k/test'   # preprocess_nnsvs.py --segs_per_shard 0
  log_dir:      'logs_nnsvs_48k'
  snapshot_dir: 'snapshots_nnsvs_48k'
  inference_output_dir: 'dataset/inference'
  snapshot_path: None                 # ckpt to resume from (None = fresh training)
  max_samples_per_epoch: 999999       # max segments per epoch (set to the real segment count for one pass)
  gradient_accumulation_steps: 2
  shuffle: true
  save_interval: 10
  nan_restart_until_epoch: 10
  # ── disc (MRD) extra params ──
  reinit_disc: false
  r1_interval: 16                     # lazy R1 (when r1_gamma>0)
  adaptive_d_gate: false
  d_gate_floor: 0.35
  d_gate_ema: 0.98
  harmonic_penalty_scale: 0           # replaced by the uv hard gate in V3 (unused)
  # ── pitch augmentation ──
  pitch_aug: true
  pitch_aug_prob: 1.0                 # ★100% (keep the anti-phase-bias pressure; no un-augmented pass)
  pitch_aug_semitones: [-1.8, 1.8]
  # ── TensorBoard visualisation ──
  tb_log_uvoff: true
  tb_disc_badness: true
  tb_linear_spec: true
  # ── optimisation ──
  lr_g: 0.00008                 # 1/5 (polish)
  lr_d: 0.00004                 # 1/5 (polish)
  lr_d_grp2: 0.00004            # 1/5 (polish)
  disc_beta1: 0.5               # GAN standard beta1=0.5 (avoids MRD sticking at d=0.5)
  disc_beta2: 0.9
  r1_gamma: 0                   # R1 off
  disc_grad_clip: 5.0
  disc_grad_clip_grp2: 5.0
  gen_grad_clip: 200.0
  crop_frames: 64               # 64*240 = 15360 samp = 320ms random crop
  min_crop_rms: 0.02            # ★reject near-silent crops in the loader (0 = disabled)
  batch_size: 16                # x gradient_accumulation_steps 2 = 32. 32 in one pass fits 16GB until the envelope loss starts (ep200), then spills to shared memory
  num_workers: 4
  amp_augment: true
  amp_aug_range: [0.5, 2.0]
  vuv_dropout_prob: 1.0         # drop the uv gate during training (learn to suppress unvoiced from mel); active only at inference
  adversarial_start: 150
  adversarial_warmup_epochs: 20
  # loss weights
  mel_loss_scale: 69            # magnitude mel loss (phase-invariant). 30 x ln(10): log10 mel
  mel_loss_floor: -5.0          # clamp both sides at log10 1e-5 (see header)
  stft_loss_scale: 10           # multi-res STFT magnitude (phase-invariant); raised for higher resolution
  stft_loss_type: 'nsf'
  adversarial_scale: 0.5        # distributional, phase-tolerant (MPD + MRD)
  feature_matching_scale: 0     # ★off: FM teaches filter-phase/GCI alignment = the dropout cause
  grp2_loss_weight: 1.0
  envelope_scale: 2.5
  envelope_start: 200
  envelope_kernel_size: 1024
  envelope_stride: 128
  envelope_directional: true
  use_amp: true
  amp_dtype: bfloat16
  n_epoch: 401                  # base config ran to ~ep300; the shipped ep350 adds a ~50-epoch 1/5-LR polish
  # multi-res STFT bands (NSF-style); 64 & 128 added for higher resolution
  window_lengths: [64, 128, 256, 512, 1024, 1536, 2048, 3072, 4096]
